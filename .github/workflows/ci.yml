name: CI

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::979075841935:role/github-actions-eks-gitops
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -t $ECR_REGISTRY/eks-gitops-app:$IMAGE_TAG .
          docker push $ECR_REGISTRY/eks-gitops-app:$IMAGE_TAG

      - name: Update image tag in manifests repo
        env:
          IMAGE_TAG: ${{ github.sha }}
          PAT: ${{ secrets.MANIFESTS_PAT }}
        run: |
          git clone https://x-access-token:$PAT@github.com/armandoaliaga/eks-gitops-manifests.git
          cd eks-gitops-manifests
          sed -i "s|tag: .*|tag: $IMAGE_TAG|" charts/hello-world/values.yaml
          git config user.email "ci@github-actions"
          git config user.name "GitHub Actions"
          git add charts/hello-world/values.yaml
          git commit -m "deploy: $IMAGE_TAG"
          git push
